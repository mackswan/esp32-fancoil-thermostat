        it.draw_pixel_at(0, 6); it.draw_pixel_at(3, 6); it.draw_pixel_at(10, 6); it.draw_pixel_at(18, 6);
        it.draw_pixel_at(0, 7); it.draw_pixel_at(18, 7);
        it.draw_pixel_at(0, 8); it.draw_pixel_at(17, 8);
        it.draw_pixel_at(1, 9); it.draw_pixel_at(16, 9);
        it.draw_pixel_at(1, 10); it.draw_pixel_at(16, 10);
        it.draw_pixel_at(2, 11); it.draw_pixel_at(3, 11); it.draw_pixel_at(14, 11); it.draw_pixel_at(15, 11);
        it.draw_pixel_at(4, 12); it.draw_pixel_at(5, 12); it.draw_pixel_at(6, 12); it.draw_pixel_at(7, 12); it.draw_pixel_at(8, 12); it.draw_pixel_at(9, 12); it.draw_pixel_at(10, 12); it.draw_pixel_at(11, 12); it.draw_pixel_at(12, 12); it.draw_pixel_at(13, 12);
      }

      // ── LEFT COLUMN ──────────────────────────────────────────
      it.printf(2, 21, id(font_medium), "%d", outside);
      { int dotx = (outside >= 100) ? 23 : 17;
        it.draw_pixel_at(dotx,   21); it.draw_pixel_at(dotx+1, 21);
        it.draw_pixel_at(dotx,   22); it.draw_pixel_at(dotx+1, 22); }

      it.print(2, 44, id(font_label), "DEW");

      it.printf(2, 55, id(font_medium), "%d", dewpt);
      { int dotx = (dewpt >= 100) ? 23 : 17;
        it.draw_pixel_at(dotx,   55); it.draw_pixel_at(dotx+1, 55);
        it.draw_pixel_at(dotx,   56); it.draw_pixel_at(dotx+1, 56); }

      // ── CENTER COLUMN ─────────────────────────────────────────
      if (adjusting) {
        it.printf(64, 6, id(font_large), TextAlign::TOP_CENTER, "%d", target);
        if (id(dim_level) > 0) it.printf(65, 6, id(font_large), TextAlign::TOP_CENTER, "%d", target);
      } else if (indoor_valid) {
        it.printf(64, 6, id(font_large), TextAlign::TOP_CENTER, "%d", indoor_f);
        if (id(dim_level) > 0) it.printf(65, 6, id(font_large), TextAlign::TOP_CENTER, "%d", indoor_f);
      } else {
        it.print(64, 6, id(font_large), TextAlign::TOP_CENTER, "--");
      }

      // Bottom label — blink "SET TEMP" during adjustment
      const char* modeStr = (mode == 0) ? "HEAT" :
                            (mode == 1) ? "COOL" : "OFF";
      if (adjusting) {
        it.print(64, 55, id(font_label), TextAlign::TOP_CENTER, "SET TEMP");
      } else {
        it.print(64, 55, id(font_label), TextAlign::TOP_CENTER, modeStr);
      }

      // ── RIGHT COLUMN ─────────────────────────────────────────
      if (adjusting) {
        // During adjustment — show actual temp in upper right
        it.print(123, 2,  id(font_label), TextAlign::TOP_RIGHT, "ACT");
        it.print(127, 10, id(font_label), TextAlign::TOP_RIGHT, "TEMP");
        if (indoor_valid) {
          it.printf(124, 21, id(font_medium), TextAlign::TOP_RIGHT, "%d", indoor_f);
          it.draw_pixel_at(126, 21); it.draw_pixel_at(127, 21);
          it.draw_pixel_at(126, 22); it.draw_pixel_at(127, 22);
        } else {
          it.print(124, 21, id(font_medium), TextAlign::TOP_RIGHT, "--");
        }
      } else {
        // Normal — show set temp in upper right
        it.print(123, 2,  id(font_label), TextAlign::TOP_RIGHT, "SET");
        it.print(127, 10, id(font_label), TextAlign::TOP_RIGHT, "TEMP");
        it.printf(124, 21, id(font_medium), TextAlign::TOP_RIGHT, "%d", target);
        it.draw_pixel_at(126, 21); it.draw_pixel_at(127, 21);
        it.draw_pixel_at(126, 22); it.draw_pixel_at(127, 22);
      }
      it.print(125, 44, id(font_label), TextAlign::TOP_RIGHT, "HUM");
      it.printf(127, 55, id(font_medium), TextAlign::TOP_RIGHT, "%d%%", humid);

# ── THERMOSTAT LOGIC ───────────────────────────────────────────
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (isnan(id(indoor_temp).state)) return;
          float temp_f = (id(indoor_temp).state * 9.0 / 5.0) + 32.0;
          float setpt  = id(setpoint_f);
          int   mode   = id(hvac_mode);
          float deadband = 1.0;
          if (mode == 0) {
            if (temp_f < setpt - deadband) id(fcu_relay).turn_on();
            if (temp_f > setpt + deadband) id(fcu_relay).turn_off();
          } else if (mode == 1) {
            if (temp_f > setpt + deadband) id(fcu_relay).turn_on();
            if (temp_f < setpt - deadband) id(fcu_relay).turn_off();
          } else {
            id(fcu_relay).turn_off();
          }

# ── HA CONTROLS (setpoint + mode) ─────────────────────────────
number:
  - platform: template
    name: "Set Temperature"
    id: ha_setpoint
    min_value: 60
    max_value: 85
    step: 1
    unit_of_measurement: "°F"
    icon: "mdi:thermometer"
    lambda: |-
      return id(setpoint_f);
    set_action:
      - lambda: |-
          id(setpoint_f) = x;
          id(last_encoder_val) = x;
          id(last_adjust_ms) = millis();
      - sensor.rotary_encoder.set_value:
          id: setpoint_encoder
          value: !lambda return x;
      - lambda: |-
          if (!isnan(id(indoor_temp).state)) {
            float temp_f = (id(indoor_temp).state * 9.0 / 5.0) + 32.0;
            float setpt  = id(setpoint_f);
            int   mode   = id(hvac_mode);
            float deadband = 1.0;
            if (mode == 0) {
              if (temp_f < setpt - deadband) id(fcu_relay).turn_on();
              if (temp_f > setpt + deadband) id(fcu_relay).turn_off();
            } else if (mode == 1) {
              if (temp_f > setpt + deadband) id(fcu_relay).turn_on();
              if (temp_f < setpt - deadband) id(fcu_relay).turn_off();
            } else {
              id(fcu_relay).turn_off();
            }
          }

select:
  - platform: template
    name: "HVAC Mode"
    id: ha_mode
    icon: "mdi:thermostat"
    options:
      - "Heat"
      - "Cool"
      - "Off"
    lambda: |-
      if (id(hvac_mode) == 0) return std::string("Heat");
      if (id(hvac_mode) == 1) return std::string("Cool");
      return std::string("Off");
    set_action:
      - lambda: |-
          if (x == "Heat") id(hvac_mode) = 0;
          else if (x == "Cool") id(hvac_mode) = 1;
          else id(hvac_mode) = 2;
          if (!isnan(id(indoor_temp).state)) {
            float temp_f = (id(indoor_temp).state * 9.0 / 5.0) + 32.0;
            float setpt  = id(setpoint_f);
            int   mode   = id(hvac_mode);
            float deadband = 1.0;
            if (mode == 0) {
              if (temp_f < setpt - deadband) id(fcu_relay).turn_on();
              if (temp_f > setpt + deadband) id(fcu_relay).turn_off();
            } else if (mode == 1) {
              if (temp_f > setpt + deadband) id(fcu_relay).turn_on();
              if (temp_f < setpt - deadband) id(fcu_relay).turn_off();
            } else {
              id(fcu_relay).turn_off();
            }
          }

# ── CLIMATE ENTITY (HomeKit wrapper — ESP32 stays in control) ───
climate:
  - platform: thermostat
    name: "Thermostat"
    sensor: indoor_temp
    min_heating_off_time: 0s
    min_heating_run_time: 0s
    min_cooling_off_time: 0s
    min_cooling_run_time: 0s
    min_idle_time: 0s
    heat_action:
      - lambda: |-
          id(hvac_mode) = 0;
          id(last_adjust_ms) = millis();
    cool_action:
      - lambda: |-
          id(hvac_mode) = 1;
          id(last_adjust_ms) = millis();
    idle_action:
      - lambda: |-
          id(last_adjust_ms) = millis();
    on_control:
      - lambda: |-
          auto t = x.get_target_temperature_low();
          if (t.has_value()) {
            id(setpoint_f) = (t.value() * 9.0 / 5.0) + 32.0;
            id(last_encoder_val) = id(setpoint_f);
            id(last_adjust_ms) = millis();
          }
      - sensor.rotary_encoder.set_value:
          id: setpoint_encoder
          value: !lambda return id(setpoint_f);
    preset:
      - name: Home
        default_target_temperature_low: 22.2
        default_target_temperature_high: 22.2
    heat_deadband: 0.5
    cool_deadband: 0.5
    visual:
      min_temperature: 15.5
      max_temperature: 29.4
      temperature_step: 0.5
